name: Docker Build and Deploy CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download code from Github repository
        uses: actions/checkout@v4

      - name: Set image tag
        id: vars
        run: |
          MERGE_MSG=$(git log -1 --format=%s)
          if echo "$MERGE_MSG" | grep -qE '^Merge pull request #[0-9]+ from '; then
            # Extract the source branch from GitHub's default merge commit message
            BRANCH=$(echo "$MERGE_MSG" | sed -E 's|^Merge pull request #[0-9]+ from [^/]+/||' | tr '/' '-')
          else
            BRANCH=$(echo "${{ github.ref_name }}" | tr '/' '-')
          fi
          echo "image_tag=${BRANCH}-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push to Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: ./application
          push: ${{ github.event_name == 'push' }}
          tags: ${{ secrets.DOCKER_USERNAME }}/test-provera:${{ steps.vars.outputs.image_tag }}

      - name: Verify Docker Compose
        run: |
          docker compose -f ./application/docker-compose.yaml config
          echo "Docker Compose file is valid!"

      # ArgoCD watches this repo, so updating the manifest here is what
      # actually triggers a deploy - no self-hosted runner needed.
      - name: Update k8s manifest with new image tag
        if: github.event_name == 'push'
        run: |
          sed -i "s|image: .*test-provera:.*|image: ${{ secrets.DOCKER_USERNAME }}/test-provera:${{ steps.vars.outputs.image_tag }}|" k8s/test-deploy.yaml

      - name: Commit and push updated manifest
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/test-deploy.yaml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: bump image tag to ${{ steps.vars.outputs.image_tag }} [skip ci]"
            git push
          fi
